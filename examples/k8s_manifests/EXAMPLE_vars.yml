# ===========================================================================
# EXAMPLE deployment vars for the NFS + storage + workload chain.
# Copy the relevant bits into your mydeployments/<name>/vars/.
# Two IPs are DISCOVERED (registry, nfs server) -- you do NOT set them here.
# ===========================================================================

# --- the app data volume (SECOND volume, on the master; separate from docker) ---
# provisioned/mounted by volume_provision + volume_mount targeting the master
volume_name: MyAppData          # a NEW volume (case a: create+partition+format)
volume_size_gb: 300
volume_mount_name: myapp         # -> /mnt/appdata on the master

# --- NFS export + k8s storage ---
nfs_export_base: /mnt/appdata      # the mounted volume path on master
nfs_volumes:
  - { name: myapp-db,    subpath: server/flask/database, size: 150Gi }
  - { name: myapp-users, subpath: server/core/users,     size: 150Gi }

# --- workload manifests + configmaps ---
manifest_src_dir: mydeployments/example/manifests   # your *.yaml.j2 files
configmap_files:
  - { name: metric-definitions-config, file: mydeployments/example/files/metric_definitions.json }
