---
# ENVIRONMENT SPEC: Chameleon project "pangea" (FILL IN your real values)
# Differs again: single cluster, single master, GPU-ish large workers, no registry.
setup: vm

platform:
  name: chameleon
  cloud: CH-PANGEA                 # <-- this project's cloud id
  zone: nova
  image: CC-Ubuntu24.04
  vm_creation_limit: 10

deploy_conn:
  remote_user: cc
  bastion:
    host: REPLACE-PANGEA-BASTION-IP
    user: cc
    key: ~/.ssh/REPLACE_PANGEA_BASTION.pem
  default_node_key: ~/.ssh/REPLACE_PANGEA_CLUSTER.pem
  strict_host_key_checking: false

topology:
  clusters: 1

node_groups:
  - name: cp
    count: 1
    roles: [k8s_control_plane]
    flavor: REPLACE-CP-LEASE-ID
    key: REPLACE_PANGEA_KEYPAIR
    networks: [CH-PANGEA-net1]
    security_groups: [default, ENABLE_SSH]
    name_pattern: "PG-M{role_i}"
    shard_by: none

  - name: workers
    count: 6
    roles: [k8s_worker]
    flavor: REPLACE-LARGE-LEASE-ID
    key: REPLACE_PANGEA_KEYPAIR
    networks: [CH-PANGEA-net1]
    security_groups: [default, ENABLE_SSH]
    name_pattern: "PG-W{role_i}"
    shard_by: none
