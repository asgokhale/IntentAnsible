---
# File-copy inputs for the copy_files role (USER DATA).
# In the pipeline you reference these BY NAME; the framework looks them up.
# Give each copy operation a UNIQUELY named list so multiple copy steps never
# collide. Each step can also name its own base dir.
common_base_dir: "specs/examples/example-deployment/files"   # control-node source dir

copy_common:
  - { src: "bash_aliases.example", dest: "/home/{{ remote_cloud_user }}/.bash_aliases" }
  # set template: true on an entry whose file needs variable substitution
