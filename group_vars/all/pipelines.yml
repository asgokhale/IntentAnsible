---
# SHARED across all environments. The steps to build a k8s cluster don't change
# per project, so they live here once -- edit a step or its order ONCE, and all
# environments get it. Per-environment specs in specs/ do NOT redefine these.
#
# (Bare-metal note: the provision_only / provisioning steps are gated by
#  when_setup: vm, so on a setup: bm spec they simply skip -- same pipeline,
#  no separate definition needed.)
pipelines:

  provision_only:
    # ===== PROVISIONING =====
    - { step: node_provision, target: local, when_setup: vm }

  full:
    # ===== PROVISIONING =====
    - { step: node_provision, target: local, when_setup: vm }
    # ===== CONFIGURATION =====
    - { step: apt_install,    target: "role:k8s_control_plane,k8s_worker,docker_registry", gather_facts: true }
    - { step: firewall,       target: "role:k8s_control_plane,k8s_worker" }
    - { step: k8s_start,      target: "role:k8s_control_plane" }
    # ... add the rest of your converted child playbooks here, in order ...

  # configure-only: skip provisioning, just (re)configure existing nodes.
  # Use with -i inv/<run>/hosts.yml on a later day.
  configure:
    # ===== CONFIGURATION =====
    - { step: apt_install,    target: "role:k8s_control_plane,k8s_worker,docker_registry", gather_facts: true }
    - { step: firewall,       target: "role:k8s_control_plane,k8s_worker" }
    - { step: k8s_start,      target: "role:k8s_control_plane" }

# Default if not overridden on CLI with -e active_pipeline=...
active_pipeline: full
