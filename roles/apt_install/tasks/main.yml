---
# Install apt packages from `apt_packages` (user data; declared via requires:
# on the pipeline step, validated pre-flight -- no per-role guard needed).
# No localhost guard needed: the pipeline targets role groups, not the control
# node, so this only runs on real nodes.
- name: "Install apt packages"
  ansible.builtin.apt:
    name: "{{ apt_packages }}"   # a list installs in ONE apt transaction (faster)
    state: latest
    update_cache: yes
  become: true
