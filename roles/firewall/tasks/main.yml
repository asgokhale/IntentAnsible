---
# Open ports from `firewall_rules` (user data; declared as a `requires:` on the
# pipeline step, so it's validated pre-flight -- no per-role guard needed).
- name: "Open firewall ports"
  ansible.posix.firewalld:
    port: "{{ item.port }}"
    zone: "{{ item.zone | default('public') }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.port }}"
