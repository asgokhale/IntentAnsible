---
# Generic file-copy role. Driven entirely by DATA.
# The framework resolves per-step vars for you, so this role receives REAL
# VALUES (not names):
#   copy_base_dir : base directory on the CONTROL node for source files
#   copy_set      : the LIST of copy entries for this step
# Each entry:
#   src           : path RELATIVE to copy_base_dir
#   dest          : absolute path on the remote node
#   template      : optional bool; true -> Jinja-substitute (template),
#                   false/absent -> byte-for-byte copy
#   mode          : optional file mode (default 0644)
- name: "Copy static files"
  ansible.builtin.copy:
    src: "{{ copy_base_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ copy_set | rejectattr('template', 'defined') | list
           + copy_set | selectattr('template', 'defined') | rejectattr('template') | list }}"
  loop_control:
    label: "{{ item.src }} -> {{ item.dest }}"

- name: "Render templated files"
  ansible.builtin.template:
    src: "{{ copy_base_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ copy_set | selectattr('template', 'defined') | selectattr('template') | list }}"
  loop_control:
    label: "{{ item.src }} -> {{ item.dest }} (template)"
