---
# Apply Canal (Flannel + Calico policy). Primary control-plane only.
- name: "Identify the primary control-plane node"
  ansible.builtin.set_fact:
    _is_primary: "{{ inventory_hostname == (groups['k8s_control_plane'] | sort | first) }}"
- name: "Download canal manifest"
  ansible.builtin.get_url:
    url: "{{ canal_manifest_url }}"
    dest: "/home/{{ remote_cloud_user }}/canal.yaml"
    mode: '0644'
  when: _is_primary | bool
- name: "Apply canal to the cluster"
  kubernetes.core.k8s:
    state: present
    src: "/home/{{ remote_cloud_user }}/canal.yaml"
    kubeconfig: "/home/{{ remote_cloud_user }}/.kube/config"
  when: _is_primary | bool
- name: "Remove downloaded manifest"
  ansible.builtin.file: { path: "/home/{{ remote_cloud_user }}/canal.yaml", state: absent }
  when: _is_primary | bool
