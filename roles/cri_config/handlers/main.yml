---
# Restart containerd ONCE, at the end, only if a config task changed something.
# Replaces the scattered imperative restart steps from the legacy playbooks.
- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    daemon_reload: true
    state: restarted
  become: true

- name: restart docker if present
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  become: true
  when: _docker_present | default(false) | bool
