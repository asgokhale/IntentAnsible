---
# ============================================================================
# containerd (CRI) configuration -- done cleanly, version-stably.
#
# WHY THIS EXISTS: kubeadm requires (a) the systemd cgroup driver and (b)
# containerd to know where to find per-registry configs. The legacy approach
# ran `containerd config default > config.toml` then regex-patched the giant
# generated file -- fragile, because that file's structure changes between
# containerd versions (see the many dated workarounds in the original).
#
# CLEAN APPROACH (default): generate the default config ONCE, then set only the
# two settings we care about with idempotent replacements. We do NOT hand-craft
# the whole file. If a future containerd changes these key names, only these two
# replace: tasks need updating -- not a wholesale rewrite.
#
# Restart is via a handler (fires once, only if something changed).
# ============================================================================

- name: "Detect whether docker is installed on this node"
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: _dockerd_bin

- name: "Set docker-present fact"
  ansible.builtin.set_fact:
    _docker_present: "{{ _dockerd_bin.stat.exists }}"

- name: "Generate a fresh default containerd config (CRI-enabled)"
  # ALWAYS regenerate: the shipped /etc/containerd/config.toml often has CRI
  # disabled or is not k8s-ready, which causes kubeadm's
  #   'unknown service runtime.v1.RuntimeService'
  # preflight failure. `containerd config default` emits a CRI-ENABLED config.
  # We then patch cgroup + registry path below.
  ansible.builtin.shell:
    cmd: "containerd config default > {{ cri_config_path }}"
  become: true
  notify:
    - restart containerd
    - restart docker if present

- name: "Ensure containerd uses the systemd cgroup driver"
  ansible.builtin.replace:
    path: "{{ cri_config_path }}"
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  become: true
  when: cri_cgroup_systemd | bool
  notify:
    - restart containerd
    - restart docker if present

# ---- Relocate containerd root onto a volume (optional) ----
# BuildKit (default for `docker compose build` / `docker build` on modern
# Docker) stores build layers under containerd's root, NOT docker's data-root,
# regardless of docker's storage driver. So a node doing builds needs its
# containerd root on the volume too. Guarded: only fires when the var is set.
- name: "Relocate containerd root: replace existing root line"
  ansible.builtin.replace:
    path: "{{ cri_config_path }}"
    regexp: '^root\s*=.*$'
    replace: 'root = "{{ containerd_root_path }}"'
  become: true
  register: _cri_root_replaced
  when: containerd_root_path is defined
  notify:
    - restart containerd
    - restart docker if present

- name: "Relocate containerd root: insert at top if config had no root line"
  ansible.builtin.lineinfile:
    path: "{{ cri_config_path }}"
    line: 'root = "{{ containerd_root_path }}"'
    insertbefore: BOF
  become: true
  when: containerd_root_path is defined and (_cri_root_replaced is not changed)
  notify:
    - restart containerd
    - restart docker if present

- name: "Ensure containerd root directory exists"
  ansible.builtin.file:
    path: "{{ containerd_root_path }}"
    state: directory
    mode: '0711'
  become: true
  when: containerd_root_path is defined

- name: "Point containerd registry config_path at certs.d (single path, no docker certs.d)"
  # The legacy default sometimes generates a DUAL path
  # '/etc/containerd/certs.d:/etc/docker/certs.d' which caused an https/http
  # mismatch pulling from the insecure registry. Collapse to just certs.d.
  ansible.builtin.replace:
    path: "{{ cri_config_path }}"
    regexp: "config_path\\s*=\\s*'/etc/containerd/certs.d:/etc/docker/certs.d'"
    replace: "config_path = '{{ cri_registry_config_path }}'"
  become: true
  notify:
    - restart containerd
    - restart docker if present

- name: "Ensure config_path is set even if it was empty ('')"
  # Fallback for containerd versions that emit config_path = '' in the registry
  # section. Only touches the empty form; harmless if the above already matched.
  ansible.builtin.replace:
    path: "{{ cri_config_path }}"
    after: "\\[plugins.'io.containerd.cri.v1.images'.registry\\]"
    before: "\\[plugins.'io.containerd.cri.v1.images'.image_decryption\\]"
    regexp: "config_path\\s*=\\s*''"
    replace: "config_path = '{{ cri_registry_config_path }}'"
  become: true
  notify:
    - restart containerd
    - restart docker if present

- name: "Ensure the certs.d directory exists"
  ansible.builtin.file:
    path: "{{ cri_registry_config_path }}"
    state: directory
    mode: '0755'
  become: true
