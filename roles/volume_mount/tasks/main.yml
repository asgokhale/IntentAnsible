---
# ============================================================================
# Attach-aware, idempotent volume setup. Handles THREE cases automatically and
# does only what's missing, printing a PLAN before any destructive action:
#   (a) raw new device            -> partition -> format -> mount
#   (b) reused device, still raw  -> partition -> format -> mount
#   (c) device already set up     -> MOUNT ONLY (never partition/format)
#
# SAFETY: partition/format happen ONLY on a device confirmed genuinely raw (no
# partitions AND no filesystem signature). ANY existing partition or filesystem
# => case (c), mount only, data preserved. volume_force=true overrides.
#
# This role assumes the volume is already attached (see volume_provision). It
# identifies the attached volume device whether or not it has partitions.
# ============================================================================
- name: "Require volume_mount_name and volume_size_gb"
  ansible.builtin.assert:
    that:
      - "volume_mount_name is defined and volume_mount_name | string | length > 0"
      - "volume_size_gb is defined and volume_size_gb | int > 0"
    fail_msg: "volume_mount needs volume_mount_name and volume_size_gb."
    quiet: true

- name: "Gather block device facts"
  ansible.builtin.setup:
    gather_subset: ['hardware']

- name: "Find the root device (never touch it)"
  ansible.builtin.shell:
    cmd: "findmnt -no SOURCE / | sed 's/[0-9]*$//; s#/dev/##'"
  register: _rootdev
  changed_when: false

# Identify the attached volume: a REAL disk (vd/sd/xvd/nvme, not loop/ram/dm/sr),
# NOT the root disk, of roughly the expected size. NOTE: unlike before, we do NOT
# require it to be unpartitioned -- a reused, already-formatted volume (case c)
# HAS partitions and must still be found so we can mount it.
- name: "Identify candidate volume device(s) by type + size (partitioned or not)"
  ansible.builtin.set_fact:
    _vol_candidates: >-
      {{ ansible_devices | dict2items
         | rejectattr('key', 'equalto', _rootdev.stdout | trim)
         | selectattr('value.removable', 'equalto', '0')
         | selectattr('key', 'match', '^(vd|sd|xvd|nvme)')
         | selectattr('value.sectors', 'defined')
         | selectattr('value.sectorsize', 'defined')
         | map(attribute='key') | list }}

- name: "Keep only candidates whose size is in the expected ballpark (GB/GiB agnostic)"
  ansible.builtin.set_fact:
    _vol_sized: >-
      {%- set out = [] -%}
      {%- for d in _vol_candidates -%}
        {%- set gb = ((ansible_devices[d].sectors | int) * (ansible_devices[d].sectorsize | int) / 1000000000) | round(0,'floor') | int -%}
        {%- if gb >= (volume_size_gb | int * 0.8) and gb <= (volume_size_gb | int * 1.2) -%}
          {%- set _ = out.append(d) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: "Require exactly one size-matched candidate device"
  ansible.builtin.assert:
    that: "_vol_sized | length == 1"
    fail_msg: >-
      Expected exactly ONE attached ~{{ volume_size_gb }}GB volume device
      (non-root, real disk) but found: {{ _vol_sized }} (all size-matched
      candidates). If empty, the volume may not be attached (check
      volume_provision / openstack volume list). If more than one, set
      volume_device explicitly with volume_force=true.
    quiet: true
  when: not (volume_force | bool)

- name: "Set the target device"
  ansible.builtin.set_fact:
    _dev_name: "{{ volume_device | default(_vol_sized[0]) }}"
    _dev: "/dev/{{ volume_device | default(_vol_sized[0]) }}"

# Decide the CASE: is this device already set up (has partitions), or raw?
- name: "Determine whether the device is already partitioned"
  ansible.builtin.set_fact:
    _has_partitions: "{{ (ansible_devices[_dev_name].partitions | default({})) | length > 0 }}"

- name: "Check for an existing filesystem signature on the device or its first partition"
  ansible.builtin.command:
    cmd: "blkid -p -o value -s TYPE {{ _dev }}{{ '1' if _has_partitions else '' }}"
  register: _blkid
  failed_when: false
  changed_when: false
  become: true

- name: "Classify: already-set-up (case c) vs raw (case a/b)"
  ansible.builtin.set_fact:
    _already_setup: "{{ _has_partitions or (_blkid.stdout | default('') | trim | length > 0) }}"

- name: "PLAN: what this run will do"
  ansible.builtin.debug:
    msg: >-
      Device {{ _dev }} ({{ ((ansible_devices[_dev_name].sectors|int)*(ansible_devices[_dev_name].sectorsize|int)/1000000000)|round(0,'floor')|int }}GB).
      {{ 'ALREADY SET UP (has partition/filesystem) -> will MOUNT ONLY, no partition/format (case c).'
         if _already_setup
         else 'RAW -> will PARTITION + FORMAT + MOUNT (case a/b).' }}

# ---- Destructive steps: ONLY on a genuinely raw device (or forced) ----
- name: "Create a GPT partition (only if raw)"
  community.general.parted:
    device: "{{ _dev }}"
    number: 1
    label: gpt
    state: present
    part_start: 0%
    part_end: 100%
  become: true
  when: (not _already_setup) or (volume_force | bool)

- name: "Format the new partition (only if raw)"
  community.general.filesystem:
    fstype: "{{ volume_fstype }}"
    dev: "{{ _dev }}1"
    # force stays false: never reformat an existing filesystem
  become: true
  when: (not _already_setup) or (volume_force | bool)

# ---- Mount (all cases converge here) ----
- name: "Determine the partition to mount"
  # Both raw (just created vdX1) and already-set-up (existing vdX1) mount the
  # first partition. If a case-c volume was formatted whole-disk (no partition),
  # fall back to the whole device.
  ansible.builtin.set_fact:
    _mount_src: "{{ _dev ~ '1' if (_has_partitions or not _already_setup) else _dev }}"

- name: "Ensure the mount point exists"
  ansible.builtin.file:
    path: "{{ volume_mount_base }}/{{ volume_mount_name }}"
    state: directory
    mode: '0755'
  become: true

- name: "Mount the volume and persist in /etc/fstab"
  ansible.posix.mount:
    path: "{{ volume_mount_base }}/{{ volume_mount_name }}"
    src: "{{ _mount_src }}"
    fstype: "{{ volume_fstype }}"
    opts: defaults
    state: mounted
  become: true

- name: "Report the mounted volume"
  ansible.builtin.debug:
    msg: >-
      Mounted {{ _mount_src }} at {{ volume_mount_base }}/{{ volume_mount_name }}
      ({{ 'existing data preserved' if _already_setup else 'freshly formatted' }}).
