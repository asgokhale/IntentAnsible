---
# volume_mount -- partition/format/mount an attached volume. GENERIC storage only
# (no docker, no cloud API). To put docker's data-root here, use the separate
# docker_config role AFTER this one.
#
# USER supplies (vars):
#   volume_mount_name : directory name under /mnt (e.g. "dockervol" -> /mnt/dockervol)
#   volume_size_gb    : the volume's size (loose sanity check to identify the device)
# Optional:
#   volume_fstype     : filesystem (default ext4)
#   volume_force      : allow (re)partitioning a NON-empty device (default false -- DANGER)
#   volume_device     : explicit device name (only with volume_force; normally auto-detected)
#   volume_mount_owner : chown the mount point to this user after mounting (e.g. cc).
#                        Leave UNSET for root-owned mounts (e.g. docker data-root).
#   volume_mount_group : group for the chown (defaults to volume_mount_owner).
volume_fstype: ext4
volume_force: false
volume_mount_base: /mnt
