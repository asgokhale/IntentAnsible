---
# volume_mount -- partition/format/mount an attached volume and point docker's
# data-root at it. GENERIC (no cloud API): works on any attached block device.
#
# USER supplies (vars):
#   volume_mount_name : directory name under /mnt (e.g. "dockervol" -> /mnt/dockervol)
#   volume_size_gb    : the volume's size (used to IDENTIFY the right device safely)
# Optional:
#   volume_fstype     : filesystem (default ext4)
#   volume_move_docker: whether to repoint docker data-root here (default true)
#   volume_force      : allow (re)partitioning a NON-empty device (default false -- DANGER)
volume_fstype: ext4
volume_move_docker: true
volume_force: false
volume_mount_base: /mnt
# docker daemon.json path (registry node)
docker_daemon_json: /etc/docker/daemon.json
