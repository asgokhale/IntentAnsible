---
# k8s_apply_manifests -- render templated k8s manifests (*.yaml.j2) with the
# discovered registry endpoint AND nfs server IP, create any configmaps from
# files, then apply everything. Primary control-plane only.
#
# USER supplies (vars):
#   manifest_src_dir : dir of *.yaml.j2 templates
# Optional:
#   configmap_files  : [ { name, file }, ... ] -- create a configmap per file
#                      (used for single-file mounts like metric_definitions.json)
#   registry_group / control_plane_group : inventory group names
registry_group: docker_registry
control_plane_group: k8s_control_plane
registry_port: 5000
configmap_files: []
manifest_render_dir: "/home/{{ remote_cloud_user }}/rendered_manifests"
k8s_python_interpreter: "{{ venv_dir }}/bin/python"
