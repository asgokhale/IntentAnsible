---
# Generates run_deployment.yml: ONE play per pipeline step.
#
# STEP SELECTION (optional, for iterating / resuming):
#   -e start_at=<step>      run from that step to the END (skip earlier ones)
#   -e only_steps='["a","b"]'  run ONLY those steps (exact set)
#   -e list_steps=true      just print the (filtered) steps and exit; generate nothing
# Precedence: only_steps wins if both given. Neither -> full active pipeline.
#
# PRE-FLIGHT: each step may declare requires:[var,...]; we check the vars for the
# EFFECTIVE (filtered) steps and report ALL missing at once before generating.
- name: "Generate the deployment runner from the active pipeline"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Compute effective step list (apply start_at / only_steps)"
      ansible.builtin.set_fact:
        _steps: >-
          {{
            (pipelines[active_pipeline] | selectattr('step','in', only_steps) | list)
            if (only_steps is defined) else
            (pipelines[active_pipeline][ _start_idx : ])
          }}
      vars:
        _names: "{{ pipelines[active_pipeline] | map(attribute='step') | list }}"
        _start_idx: "{{ (_names.index(start_at)) if (start_at is defined and start_at in _names) else 0 }}"

    - name: "Fail if start_at names a step not in the pipeline"
      ansible.builtin.assert:
        that: "start_at is not defined or start_at in (pipelines[active_pipeline] | map(attribute='step') | list)"
        fail_msg: >-
          start_at='{{ start_at | default('') }}' is not a step in pipeline
          '{{ active_pipeline }}'. Steps are:
          {{ pipelines[active_pipeline] | map(attribute='step') | list }}
        quiet: true

    - name: "List steps and exit (list_steps=true)"
      when: list_steps | default(false) | bool
      block:
        - name: "Show effective steps"
          ansible.builtin.debug:
            msg: >-
              Pipeline '{{ active_pipeline }}'
              {{ '(filtered)' if (start_at is defined or only_steps is defined) else '(full)' }}:
              {{ _steps | map(attribute='step') | list }}
        - name: "Stop after listing"
          ansible.builtin.meta: end_play

    - name: "Pre-flight: collect required vars that are missing/empty"
      ansible.builtin.set_fact:
        _missing_requires: >-
          {{ _missing_requires | default([])
             + [ {'step': item.0.step, 'var': item.1} ]
             if (vars[item.1] is not defined or vars[item.1] | length == 0)
             else _missing_requires | default([]) }}
      loop: "{{ _steps | subelements('requires', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.step }} needs {{ item.1 }}"

    - name: "Pre-flight: fail with ALL missing inputs at once"
      ansible.builtin.assert:
        that: "_missing_requires | default([]) | length == 0"
        fail_msg: |-
          Your deployment is missing required inputs. Set each var below (copy the
          matching file from specs/examples/example-deployment/vars/ into your
          deployment's vars/ directory, or pass with -e), then re-run:
          {% for m in _missing_requires | default([]) %}
            - step '{{ m.step }}' requires: {{ m.var }}
          {% endfor %}
        success_msg: "Pre-flight OK: all required inputs present."
        quiet: true

    - name: "Render run_deployment.yml (effective steps only)"
      ansible.builtin.template:
        src: templates/run_deployment.yml.j2
        dest: "{{ playbook_dir }}/run_deployment.yml"
        mode: "0644"
