---
# Generates run_deployment.yml: ONE play per pipeline step.
#
# STEP SELECTION (optional, for iterating / resuming):
#   -e start_at=<step>      run from that step to the END (skip earlier ones)
#   -e only_steps='["a","b"]'  run ONLY those steps (exact set)
#   -e list_steps=true      just print the (filtered) steps and exit; generate nothing
# Precedence: only_steps wins if both given. Neither -> full active pipeline.
#
# PRE-FLIGHT: each step may declare requires:[var,...]; we check the vars for the
# EFFECTIVE (filtered) steps and report ALL missing at once before generating.
- name: "Generate the deployment runner from the active pipeline"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Validate that the requested pipeline exists"
      ansible.builtin.assert:
        that: "active_pipeline in pipelines"
        fail_msg: >-
          Pipeline '{{ active_pipeline }}' is not defined. Available pipelines:
          {{ pipelines.keys() | list }}
        quiet: true

    # ---- Pipeline includes ----------------------------------------------
    # A pipeline may compose others: interleave `{ include: <name> }` entries
    # with normal steps. We flatten includes (in order) into one step list, so
    # e.g.  full: [ {include: configure}, {include: k8s_cluster} ]  runs both
    # with no duplicated steps. We do several passes to allow one child to also
    # include another; a pass cap prevents infinite loops on accidental cycles.
    - name: "Seed expansion with the requested pipeline"
      ansible.builtin.set_fact:
        _all_steps: "{{ pipelines[active_pipeline] }}"

    - name: "Validate all include names reference real pipelines"
      ansible.builtin.assert:
        that: "item.include in pipelines"
        fail_msg: >-
          Pipeline include references unknown pipeline '{{ item.include }}'.
          Available pipelines: {{ pipelines.keys() | list }}
        quiet: true
      loop: "{{ pipelines.values() | map('selectattr', 'include', 'defined') | map('list') | flatten }}"
      loop_control:
        label: "{{ item.include }}"

    - name: "Flatten includes (bounded passes handle nesting; cap guards cycles)"
      ansible.builtin.set_fact:
        _all_steps: >-
          {%- set out = [] -%}
          {%- for s in _all_steps -%}
            {%- if s.include is defined -%}
              {%- set _ = out.extend(pipelines[s.include]) -%}
            {%- else -%}
              {%- set _ = out.append(s) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      loop: "{{ range(0, 5) | list }}"
      when: "(_all_steps | selectattr('include','defined') | list | length) > 0"

    - name: "Fail if any include did not resolve (unknown or cyclic)"
      ansible.builtin.assert:
        that: "(_all_steps | selectattr('include','defined') | list | length) == 0"
        fail_msg: >-
          Unresolved pipeline include(s) after expansion -- check for an unknown
          pipeline name or an include cycle in: {{ active_pipeline }}
        quiet: true

    - name: "Normalize step ids (id defaults to the step/role name)"
      ansible.builtin.set_fact:
        _all_steps: >-
          {{ _all_steps
             | map('combine', {}) | list }}

    - name: "Attach effective id to each step"
      ansible.builtin.set_fact:
        _all_steps: >-
          {{ _all_steps[:idx]
             + [ item | combine({'_id': item.id | default(item.step)}) ]
             + _all_steps[idx+1:] }}
      loop: "{{ _all_steps }}"
      loop_control:
        index_var: idx
        label: "{{ item.id | default(item.step) }}"

    - name: "Compute effective step list (apply start_at / only_steps, matched by id)"
      ansible.builtin.set_fact:
        _steps: >-
          {{
            (_all_steps | selectattr('_id','in', only_steps) | list)
            if (only_steps is defined) else
            (_all_steps[ _start_idx : ])
          }}
      vars:
        _ids: "{{ _all_steps | map(attribute='_id') | list }}"
        _start_idx: "{{ (_ids.index(start_at)) if (start_at is defined and start_at in _ids) else 0 }}"

    - name: "Fail if start_at names an id not in the pipeline"
      ansible.builtin.assert:
        that: "start_at is not defined or start_at in (_all_steps | map(attribute='_id') | list)"
        fail_msg: >-
          start_at='{{ start_at | default('') }}' is not a step id in pipeline
          '{{ active_pipeline }}'. Step ids are:
          {{ _all_steps | map(attribute='_id') | list }}
        quiet: true

    - name: "List steps and exit (list_steps=true)"
      when: list_steps | default(false) | bool
      block:
        - name: "Show effective steps"
          ansible.builtin.debug:
            msg: >-
              Pipeline '{{ active_pipeline }}'
              {{ '(filtered)' if (start_at is defined or only_steps is defined) else '(full)' }}:
              {{ _steps | map(attribute='_id') | list }}
        - name: "Stop after listing"
          ansible.builtin.meta: end_play

    - name: "Pre-flight: collect required vars that are missing/empty"
      ansible.builtin.set_fact:
        _missing_requires: >-
          {{ _missing_requires | default([])
             + [ {'step': item.0.step, 'var': item.1} ]
             if (vars[item.1] is not defined or vars[item.1] | length == 0)
             else _missing_requires | default([]) }}
      loop: "{{ _steps | subelements('requires', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.step }} needs {{ item.1 }}"

    - name: "Pre-flight: fail with ALL missing inputs at once"
      ansible.builtin.assert:
        that: "_missing_requires | default([]) | length == 0"
        fail_msg: |-
          Your deployment is missing required inputs. Set each var below (copy the
          matching file from specs/examples/example-deployment/vars/ into your
          deployment's vars/ directory, or pass with -e), then re-run:
          {% for m in _missing_requires | default([]) %}
            - step '{{ m.step }}' requires: {{ m.var }}
          {% endfor %}
        success_msg: "Pre-flight OK: all required inputs present."
        quiet: true

    - name: "Render run_deployment.yml (effective steps only)"
      ansible.builtin.template:
        src: templates/run_deployment.yml.j2
        dest: "{{ playbook_dir }}/run_deployment.yml"
        mode: "0644"
